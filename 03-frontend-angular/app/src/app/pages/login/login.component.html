<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow" style="width: 380px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">Iniciar sesión</h4>

      <form (submit)="$event.preventDefault(); ingresar()">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" [(ngModel)]="username" name="username" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" name="password" required />
        </div>

        <div class="alert alert-danger py-2" *ngIf="error()">{{ error() }}</div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.85rem;">
        Demo: <strong>admin</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>
</div>
